<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Basics: Rule-Based vs. LLM Chatbot</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    html.dark body { background-color: #0f172a; color: #e2e8f0; }
    html.dark header,
    html.dark section,
    html.dark .bg-white { background-color: #1e293b !important; color: #e2e8f0; }
    html.dark .bg-slate-50,
    html.dark .bg-slate-50\/70,
    html.dark .bg-slate-50\/50,
    html.dark .bg-slate-50\/40 { background-color: #0f172a !important; }
    html.dark .bg-slate-100 { background-color: #334155 !important; color: #e2e8f0; }
    html.dark .bg-indigo-50\/70 { background-color: #1e1b4b !important; }
    html.dark .bg-indigo-50 { background-color: #312e81 !important; color: #e0e7ff !important; }
    html.dark .border-slate-200,
    html.dark .border-slate-100,
    html.dark .border-indigo-100,
    html.dark .border-indigo-200 { border-color: #334155 !important; }
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700 { color: #f1f5f9 !important; }
    html.dark .text-slate-600,
    html.dark .text-slate-500,
    html.dark .text-slate-400 { color: #94a3b8 !important; }
    html.dark .text-indigo-950,
    html.dark .text-indigo-900\/90,
    html.dark .text-indigo-700 { color: #c7d2fe !important; }
    html.dark input,
    html.dark select,
    html.dark textarea { background-color: #0f172a !important; color: #f1f5f9 !important; border-color: #475569 !important; }
    html.dark code.bg-slate-200 { background-color: #334155 !important; color: #e2e8f0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Compact Top Header -->
  <header class="bg-white border-b border-slate-200 px-3 py-2 sm:px-6">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-indigo-600 text-white text-[11px] font-bold">AI</span>
        <h1 class="text-sm sm:text-base font-bold text-slate-900">Chatbot Basics Lab <span class="text-[10px] font-normal text-slate-400">v2.2 + RAG</span></h1>
      </div>

      <div class="flex flex-wrap items-center gap-1.5">
        <button id="btn-dark-mode" type="button"
          class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition-colors">
          Dark Mode
        </button>
        <!-- Mode Switcher -->
        <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg border border-slate-200">
          <button id="btn-mode-rule" type="button"
            class="px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm">
            1. Rules
          </button>
          <button id="btn-mode-llm" type="button"
            class="px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all text-slate-600 hover:text-slate-900">
            2. LLM Mode
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5">

    <!-- Left Column: Interactive Chat -->
    <section class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm flex flex-col min-h-[78vh] lg:h-[740px] overflow-hidden">
      <!-- Chat Status Bar -->
      <div class="px-4 py-2.5 border-b border-slate-100 bg-slate-50/70 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span id="status-label" class="text-xs sm:text-sm font-semibold text-slate-700">Rule-Based Engine (Keyword Matcher)</span>
        </div>
      </div>

      <!-- System Instruction Bar (Visible in LLM Mode) -->
      <div id="system-prompt-bar" class="hidden px-4 py-3 bg-indigo-50/70 border-b border-indigo-100 space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label for="system-input" class="text-[11px] font-semibold uppercase tracking-wider text-indigo-700">
            System Instruction (Role &amp; Rules + Custom RAG Knowledge)
          </label>
        </div>
        <input id="system-input" type="text"
          value="You are a knowledgeable, professional AI Assistant. Provide clear, accurate, and concise answers grounded in the conversation context. If you are unsure of a fact, state that clearly rather than guessing."
          class="w-full text-xs sm:text-sm bg-white border border-indigo-200 rounded-lg px-3 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <div class="flex flex-wrap items-center gap-2 pt-0.5">
          <label for="api-key-input" class="text-[11px] font-semibold text-slate-600 shrink-0">Gemini API Key:</label>
          <input id="api-key-input" type="password" autocomplete="off"
            placeholder="Paste Gemini API key here for live AI answers"
            class="flex-1 min-w-[200px] text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>

      <!-- Messages Area -->
      <div id="chat-messages" class="flex-1 min-h-[320px] max-h-[55vh] lg:max-h-none overflow-y-auto p-4 space-y-3 chat-scroll bg-white">
        <!-- Populated by JS -->
      </div>

      <!-- Quick Sample Prompts -->
      <div class="px-3 py-1.5 border-t border-slate-100 bg-slate-50/50 flex items-center gap-1.5 overflow-x-auto whitespace-nowrap">
        <span class="text-[11px] font-medium text-slate-400 mr-1">Try:</span>
        <button type="button" class="quick-prompt text-xs bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-700 px-2.5 py-1 rounded-full transition-colors" data-prompt="Hello!">Hello!</button>
        <button type="button" class="quick-prompt text-xs bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-700 px-2.5 py-1 rounded-full transition-colors" data-prompt="How do I deploy this app?">Deploy to Netlify?</button>
        <button type="button" class="quick-prompt text-xs bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-700 px-2.5 py-1 rounded-full transition-colors" data-prompt="What is RAG?">What is RAG?</button>
      </div>

      <!-- Input Form -->
      <form id="chat-form" class="p-3 sm:p-4 border-t border-slate-200 bg-white flex items-end gap-2">
        <textarea id="user-input" rows="2" autocomplete="off"
          placeholder="Type a message here..."
          class="flex-1 text-base leading-snug border border-slate-300 rounded-xl px-4 py-2.5 resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white text-base font-semibold px-5 py-3 rounded-xl transition-colors shrink-0">
          Send
        </button>
      </form>
    </section>

    <!-- Right Column: Under-the-Hood Inspector -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-900">Under the Hood (Live State)</h2>
          <span id="token-badge" class="text-xs font-mono font-semibold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
            ~0 tokens
          </span>
        </div>
        <div id="live-trace" class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-3 mb-3 leading-relaxed">
          Waiting for your first message...
        </div>
        <div id="llm-controls" class="hidden space-y-3 pt-2 border-t border-slate-100">
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="font-semibold text-slate-700">Temperature (Randomness)</span>
              <span id="temp-value" class="font-mono text-indigo-600 font-semibold">0.7</span>
            </div>
            <input id="temp-slider" type="range" min="0" max="1" step="0.1" value="0.7"
              class="w-full accent-indigo-600 cursor-pointer" />
          </div>
        </div>
        <div class="mt-3">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
              Saved on Device (<span id="turn-count">0</span> messages)
            </span>
          </div>
          <pre id="context-json" class="text-[11px] bg-slate-900 text-slate-200 rounded-xl p-3 max-h-36 overflow-y-auto leading-relaxed">[]</pre>
        </div>
      </div>
    </section>
  </main>

  <script>
    // =========================================================================
    // CUSTOM RAG KNOWLEDGE BASE (Add your facts, notes, or documentation here!)
    // =========================================================================
    const KNOWLEDGE_BASE = [
      {
        title: "Netlify and GitHub Deployment",
        keywords: ["deploy", "netlify", "github", "hosting", "live"],
        content: "To deploy this app, push your code repository to GitHub, connect your repository to Netlify, and set the publish directory to root."
      },
      {
        title: "Gemini API Configuration",
        keywords: ["gemini", "api", "key", "google", "error", "404"],
        content: "The app communicates with Google Gemini using the endpoint 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent' and requires a valid Google AI Studio API key."
      },
      {
        title: "Retrieval-Augmented Generation (RAG)",
        keywords: ["rag", "knowledge", "custom data", "documents", "search"],
        content: "RAG works client-side in this app by scanning the KNOWLEDGE_BASE array for matching keywords and injecting relevant text excerpts directly into the LLM system instruction context window."
      }
    ];

    function retrieveLocalKnowledge(userText) {
      const lowerQuery = userText.toLowerCase();
      let matchedSnippets = [];

      for (const item of KNOWLEDGE_BASE) {
        const isMatched = item.keywords.some(kw => lowerQuery.includes(kw));
        if (isMatched) {
          matchedSnippets.push(`- [${item.title}]: ${item.content}`);
        }
      }

      if (matchedSnippets.length > 0) {
        return "\n\nRetrieved Knowledge Base Context:\n" + matchedSnippets.join("\n");
      }
      return "";
    }

    const KEYWORD_RULES = [
      { keywords: ["hello", "hi", "hey"], reply: "Hi there! Switch to LLM Mode to use your Gemini API key." },
      { keywords: ["help", "rag"], reply: "I can look up knowledge or answer questions using the Gemini API." }
    ];

    function getRuleBasedReply(userText) {
      const lower = userText.toLowerCase();
      for (const rule of KEYWORD_RULES) {
        for (const word of rule.keywords) {
          if (lower.includes(word)) {
            return { reply: rule.reply, trace: `Matched keyword "${word}".` };
          }
        }
      }
      return { reply: "I don't have a rule for that! Switch to LLM Mode.", trace: "Default fallback." };
    }

    async function callLanguageModel(systemInstruction, history, temperature) {
      const apiKeyEl = document.getElementById("api-key-input");
      const apiKey = apiKeyEl ? apiKeyEl.value.trim() : "";
      const lastUserMsg = history[history.length - 1].content;
      
      const ragContext = retrieveLocalKnowledge(lastUserMsg);
      const enhancedSystemInstruction = systemInstruction + ragContext;

      if (!apiKey) {
        return {
          reply: "Please enter your Gemini API key in the configuration bar above to generate live responses.",
          trace: "API key missing."
        };
      }

      try {
        const contents = history.map(m => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }]
        }));

        const res = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify({
              system_instruction: { 
                parts: [{ text: enhancedSystemInstruction }] 
              },
              contents: contents
            })
          }
        );

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `API error status code (${res.status})`);
        }

        const data = await res.json();
        const parts = data?.candidates?.[0]?.content?.parts || [];
        const liveReply = parts.map(p => p.text || "").filter(Boolean).join("\n").trim();

        if (liveReply) {
          return {
            reply: liveReply,
            trace: `Successfully called Gemini API (gemini-1.5-flash)${ragContext ? " with RAG context injected." : "."}`
          };
        }

        return {
          reply: "Gemini returned an empty response.",
          trace: "Empty content parts received."
        };

      } catch (err) {
        return {
          reply: `API Error: ${err.message}. Please verify your API key.`,
          trace: `Call failed: ${err.message}`
        };
      }
    }

    let currentMode = "rule";
    let chatHistory = [];

    const chatMessagesEl = document.getElementById("chat-messages");
    const chatFormEl = document.getElementById("chat-form");
    const userInputEl = document.getElementById("user-input");
    const systemPromptBar = document.getElementById("system-prompt-bar");
    const systemInputEl = document.getElementById("system-input");
    const llmControlsEl = document.getElementById("llm-controls");
    const tempSliderEl = document.getElementById("temp-slider");
    const tempValueEl = document.getElementById("temp-value");
    const liveTraceEl = document.getElementById("live-trace");
    const contextJsonEl = document.getElementById("context-json");
    const turnCountEl = document.getElementById("turn-count");
    const tokenBadgeEl = document.getElementById("token-badge");
    const statusDotEl = document.getElementById("status-dot");
    const statusLabelEl = document.getElementById("status-label");
    const btnModeRule = document.getElementById("btn-mode-rule");
    const btnModeLlm = document.getElementById("btn-mode-llm");

    function renderMessages() {
      chatMessagesEl.innerHTML = "";
      if (chatHistory.length === 0) {
        chatMessagesEl.innerHTML = `<div class="text-center py-10 px-4 text-slate-400 text-sm">Send a message below or try a prompt chip!</div>`;
        return;
      }
      chatHistory.forEach(msg => {
        const isUser = msg.role === "user";
        const wrapper = document.createElement("div");
        wrapper.className = `flex ${isUser ? "justify-end" : "justify-start"}`;
        const bubble = document.createElement("div");
        bubble.className = isUser
          ? "max-w-[88%] bg-indigo-600 text-white text-base leading-relaxed px-4 py-3 rounded-2xl rounded-br-sm shadow-sm whitespace-pre-wrap"
          : "max-w-[88%] bg-slate-100 text-slate-800 text-base leading-relaxed px-4 py-3 rounded-2xl rounded-bl-sm border border-slate-200 whitespace-pre-wrap";
        bubble.textContent = msg.content;
        wrapper.appendChild(bubble);
        chatMessagesEl.appendChild(wrapper);
      });
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function updateTelemetry(traceText) {
      turnCountEl.textContent = chatHistory.length;
      contextJsonEl.textContent = JSON.stringify(chatHistory, null, 2);
      if (traceText) liveTraceEl.textContent = traceText;
    }

    function setMode(mode) {
      currentMode = mode;
      if (mode === "rule") {
        btnModeRule.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm";
        btnModeLlm.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all text-slate-600 hover:text-slate-900";
        systemPromptBar.classList.add("hidden");
        llmControlsEl.classList.add("hidden");
        statusDotEl.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
        statusLabelEl.textContent = "Rule-Based Engine";
      } else {
        btnModeLlm.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all bg-white text-indigo-700 shadow-sm";
        btnModeRule.className = "px-2.5 py-1 rounded-md text-[11px] font-semibold transition-all text-slate-600 hover:text-slate-900";
        systemPromptBar.classList.remove("hidden");
        llmControlsEl.classList.remove("hidden");
        statusDotEl.className = "w-2.5 h-2.5 rounded-full bg-indigo-500";
        statusLabelEl.textContent = "LLM Mode (Gemini API + RAG Active)";
      }
    }

    async function handleSend(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      chatHistory.push({ role: "user", content: trimmed });
      renderMessages();

      let result;
      if (currentMode === "rule") {
        result = getRuleBasedReply(trimmed);
      } else {
        result = await callLanguageModel(systemInputEl.value, chatHistory, parseFloat(tempSliderEl.value));
      }

      chatHistory.push({ role: "assistant", content: result.reply });
      renderMessages();
      updateTelemetry(result.trace);
    }

    chatFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = userInputEl.value;
      userInputEl.value = "";
      handleSend(val);
    });

    document.querySelectorAll(".quick-prompt").forEach(btn => {
      btn.addEventListener("click", () => handleSend(btn.dataset.prompt));
    });

    btnModeRule.addEventListener("click", () => setMode("rule"));
    btnModeLlm.addEventListener("click", () => setMode("llm"));
    tempSliderEl.addEventListener("input", () => { tempValueEl.textContent = tempSliderEl.value; });

    renderMessages();
  </script>
</body>
</html>
